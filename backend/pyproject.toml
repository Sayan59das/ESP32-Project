# Tool configuration only. Dependencies live in requirements*.txt because the
# backend is run as the `app` package from this directory, not installed.

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF", "PT", "C4"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
